    next_tenancy: null                 # two leads competing for this slot (Sebastien preferred, Huzayfa backup)
    notes: "2BR free for Sep 1 (operator-confirmed). Listed $4,200/mo. Recurring signal: South-Bay workers flag the cross-bay distance — a listing/targeting issue worth noting."
