# Units dashboard — single source of truth for dates. Agent-maintained.
# Seeded 2026-07-04 from FF emails in the operator's Gmail. Fields marked
# CONFIRM are unverified — the agent must not confirm availability to any
# lead until the operator fills them.
#
# NOTE: business-context docs assumed units "Fremont" and "Newark"; observed
# FF listings are a 1B1B (Fremont, CA) and a 2BR (city unconfirmed — lead
# emails reference Palo Alto / Menlo Park / Sunnyvale area requests).
# Operator to reconcile naming.
units:
  - unit: unit_1b1b
    listing_names:
      furnished_finder: "Ultra Clean 1B1B King Suite, Modern Kitchen, In-Unit WD, Balcony, Carport, Netflix"
    city: "Fremont, CA"                # from FF direct-message metadata (2026-05-04)
    listed_rate_monthly: 3800          # from FF direct-message metadata (2026-05-04)
    reviewed: CONFIRM                  # which unit carries the review history?
    current_tenancy: CONFIRM           # occupied? tenant? lease start/end?
    next_tenancy: CONFIRM
    economics:                         # from mortgage statement 2026-07-06 + operator inputs
      mortgage_total: 1861             # RoundPoint: P ~831 (equity) + I ~1020 + escrow ~10; rate 3.375%
      mortgage_principal: 831          # EQUITY — excluded from economic cost
      mortgage_interest_escrow: 1030   # real expense portion of the mortgage
      hoa: 750
      property_tax: 600                # paid separately (escrow is only ~$10/mo)
      insurance: 75
      occupied_variable_monthly: 325   # electricity 200 + cleaning 125 (cleaning often passed to guest as a fee)
      internet: covered
      fixed_cash_monthly: 3286         # 1861 + 750 + 600 + 75
      fixed_economic_monthly: 2455     # drops the 831 principal (equity)
      breakeven_75pct_cash: 4700       # FF $3,800 ~$900/mo cash-short at 75% occ
      breakeven_75pct_economic: 3600   # FF $3,800 ~$200/mo ahead economically + builds ~$10k/yr equity
      ff_cashflow_breakeven_occupancy: "~95%"
      airbnb_1mo_min_floor: 4700       # 75% occupancy, split-fee
      airbnb_1mo_min_target: 5500      # ~$175–195/night; cash-positive above ~63% occupancy
    notes: "Heavy FF inquiry traffic Apr–early May 2026, then quiet — possibly booked in May. No booking-confirmation email found; occupancy unknown. Cost stack suggests 1B1B is Airbnb-forward (short MTR stays) rather than a thin FF anchor."

  - unit: unit_2br
    listing_names:
      furnished_finder: "Ultra Clean Two-Story 2BR 1.5BA, In-Unit WD, Carport, Netflix"
