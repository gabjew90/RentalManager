# Units dashboard — single source of truth for dates. Agent-maintained.
# PLACEHOLDER DATA: the agent will refuse to run until the operator replaces
# every <...> value with real data.
units:
  - unit: fremont
    listing_names:
      furnished_finder: "<FF listing title>"
      airbnb: "<Airbnb listing title>"
    reviewed: true                  # this unit has the review history
    base_rate_monthly: <e.g. 3400>  # 6+ month rate, USD
    current_tenancy:
      tenant: "<name>"
      contact: "<email/phone>"
      channel: <furnished_finder|airbnb>
      lease_start: <YYYY-MM-DD>
      lease_end: <YYYY-MM-DD>
      rate_monthly: <USD>
      extension_status: not_yet_due   # not_yet_due|offered|accepted|declined|month_to_month
      departure_confirmed: false
    next_tenancy: null                # or {tenant, channel, move_in: YYYY-MM-DD, lease_end, rate_monthly}
    channel_calendar:
      airbnb_blocked_through: <YYYY-MM-DD>   # what the Airbnb calendar currently shows
      ff_available_from: <YYYY-MM-DD>        # what the FF listing currently shows

  - unit: newark
    listing_names:
      furnished_finder: "<FF listing title>"
      airbnb: "<Airbnb listing title>"
    reviewed: false                  # newer unit — templates cross-reference Fremont's reviews
    base_rate_monthly: <USD>
    current_tenancy:
      tenant: "<name>"
      contact: "<email/phone>"
      channel: <furnished_finder|airbnb>
      lease_start: <YYYY-MM-DD>
      lease_end: <YYYY-MM-DD>
      rate_monthly: <USD>
      extension_status: not_yet_due
      departure_confirmed: false
    next_tenancy: null
    channel_calendar:
      airbnb_blocked_through: <YYYY-MM-DD>
      ff_available_from: <YYYY-MM-DD>
