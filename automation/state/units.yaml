# Units dashboard — single source of truth for dates. Agent-maintained.
# Seeded 2026-07-04 from FF emails in the operator's Gmail. Fields marked
# CONFIRM are unverified — the agent must not confirm availability to any
# lead until the operator fills them.
#
# NOTE: reconciled with the original docs — 1B1B = Fremont, 2BR = Newark.
# Newark is adjacent to Fremont; both are East Bay. South-Bay/Peninsula
# leads (Palo Alto / Mountain View / Sunnyvale) find the 2BR "far".
units:
  - unit: unit_1b1b
    listing_names:
      furnished_finder: "Ultra Clean 1B1B King Suite, Modern Kitchen, In-Unit WD, Balcony, Carport, Netflix"
    city: "Fremont, CA"                # from FF direct-message metadata (2026-05-04)
    listed_rate_monthly: 3800          # from FF direct-message metadata (2026-05-04)
    reviewed: CONFIRM                  # which unit carries the review history?
    current_tenancy: CONFIRM           # occupied? tenant? lease start/end?
    next_tenancy: CONFIRM
    economics:                         # from mortgage statement 2026-07-06 + operator inputs
      mortgage_total: 1861             # RoundPoint: P ~831 (equity) + I ~1020 + escrow ~10; rate 3.375%
      mortgage_principal: 831          # EQUITY — excluded from economic cost
      mortgage_interest_escrow: 1030   # real expense portion of the mortgage
      hoa: 750
      property_tax: 600                # paid separately (escrow is only ~$10/mo)
      insurance: 75
      electricity_monthly: 100         # when operator covers it
      cleaning_per_booking: 125        # PER TURNOVER, not monthly — scales with # of bookings.
                                       #   1-mo stays ≈ 1 clean/mo; 12-mo booking ≈ 1 clean/yr (~$10/mo).
                                       #   On Airbnb usually passed to guest as a cleaning fee (≈ wash).
      internet: covered
      fixed_cash_monthly: 3286         # 1861 + 750 + 600 + 75
      fixed_economic_monthly: 2455     # drops the 831 principal (equity)
      breakeven_75pct_cash: 4600       # FF $3,800 ~$800/mo cash-short at 75% occ
      breakeven_75pct_economic: 3500   # FF $3,800 ~$300/mo ahead economically + builds ~$10k/yr equity
      ff_cashflow_breakeven_occupancy: "~92%"
      airbnb_1mo_min_floor: 4750       # 75% occupancy, split-fee (÷0.97)
      airbnb_1mo_min_target: 5500      # ~$175–195/night; cash-positive above ~63% occupancy
      annual_12mo:                     # 100% occupancy, direct lease (no platform fee), 1 clean/yr
        cash_breakeven: 3400
        economic_breakeven: 2565
        floor: 3600                    # below this, giving away the summer-intern premium for free
        target: 4000                   # band 3900–4200; ~$600/mo cash + ~$831 equity at $4,000
        note: "At ~$3,900 the annual matches a 75%-occupied Airbnb year with zero vacancy/turnover risk. Opportunity cost = forgoing May–Aug intern premium."
    notes: "Heavy FF inquiry traffic Apr–early May 2026, then quiet — possibly booked in May. No booking-confirmation email found; occupancy unknown. Cost stack suggests 1B1B is Airbnb-forward (short MTR stays) rather than a thin FF anchor."

  - unit: unit_2br
    listing_names:
      furnished_finder: "Ultra Clean Two-Story 2BR 1.5BA, In-Unit WD, Carport, Netflix"
    ff_property_id: 951920             # from FF lead links
    city: "Newark, CA"                 # confirmed by operator. Adjacent to Fremont (minutes away);
                                       # East-Bay/Fremont workers fit well, South-Bay leads find it "far".
    listed_rate_monthly: 4200          # confirmed from FF property card (Jul 6 message)
    reviewed: CONFIRM
    availability:
      free_from: 2026-09-01            # operator-confirmed 2026-07-07: 2BR is free for the Sep 1 window
      status: OPEN                     # no signed next tenant yet
    economics:                         # operator-provided 2026-07-07
      fixed_alwayson_monthly: 3775     # mortgage+HOA+insurance+tax 3700 + internet 75 (runs during gaps)
      electricity_monthly: 125         # occupied only
      cleaning_per_booking: 200        # per turnover
      principal_portion: CONFIRM       # P/I split not yet provided — sets cash vs economic break-even
      base_occupied_monthly: 3900      # fixed always-on + electricity
      all_in_12mo_monthly: 3917        # ~$47,000/yr, no gaps, 1 cleaning
      overhead_per_stay: 1071          # 1-week gap carry (~871) + cleaning (200)
      breakeven_by_term:               # base 3900 + overhead/N months
        1mo: 4970
        2mo: 4440
        3mo: 4260
        6mo: 4080
        12mo: 3920
      note: "FF listed $4,200 is priced for long stays: covers 12mo comfortably (~$280/mo margin) but only ~break-even at 3mo and thin (~$120/mo) at 6mo. Add margin above break-even per term."
    next_tenancy: null                 # two leads competing for this slot (Sebastien preferred, Huzayfa backup)
    notes: "2BR free for Sep 1 (operator-confirmed). Listed $4,200/mo. Recurring signal: South-Bay workers flag the cross-bay distance — a listing/targeting issue worth noting."
